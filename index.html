<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#033b20">
  <title>Happy Bash Day 5 😋🎍</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <span class="spark spark-one" aria-hidden="true">✦</span>
  <span class="spark spark-two" aria-hidden="true">✧</span>
  <span class="spark spark-three" aria-hidden="true">✦</span>

  <main class="scene">
    <header class="heading">
      <p class="eyebrow">Ajke kon ganja khaiya hall guard dibe? guess </p>
      <h1 class="title">Happy Bash Day <span id="day-number">4</span></h1>
    </header>

    <section class="panda-stage" aria-label="A panda holding bamboo">
      <div class="speech-bubble" role="status">
        <span class="bubble-text">vai ajke ki hobe😭 kon bash kahaite choltesos..Chikon naki mota ta😭🎍..jei 80+ Answer korbe o akta gay😭 </span>
      </div>

      <div class="panda-character" aria-hidden="true">
        <div class="ear ear-left"></div>
        <div class="ear ear-right"></div>
        <div class="head">
          <div class="eye-patch patch-left"><span class="eye"></span></div>
          <div class="eye-patch patch-right"><span class="eye"></span></div>
          <div class="nose"></div>
          <div class="mouth"></div>
          <div class="cheek cheek-left"></div>
          <div class="cheek cheek-right"></div>
        </div>
        <div class="body"></div>
        <div class="arm arm-left"></div>
        <div class="arm arm-right"></div>
        <div class="bamboo">
          <span class="bamboo-leaf leaf-one"></span>
          <span class="bamboo-leaf leaf-two"></span>
          <span class="bamboo-leaf leaf-three"></span>
          <span class="bamboo-joint joint-one"></span>
          <span class="bamboo-joint joint-two"></span>
          <span class="bamboo-joint joint-three"></span>
        </div>
        <div class="leg leg-left"></div>
        <div class="leg leg-right"></div>
      </div>
      <p class="panda-caption">🎍😋 bash hate hajir exam er por khaiyo!</p>
    </section>

    <footer class="footer">
      <span class="footer-line"></span>
      <p>Created by <strong>Mohammad Nur</strong></p>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
